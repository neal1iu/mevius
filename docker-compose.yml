services:
  api:
    build: .
    env_file: .env
    environment:
      MEVIUS_DB_PATH: /data/mevius.db
    volumes:
      - mevius-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${MEVIUS_HTTP_PORT:-80}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mevius-data: