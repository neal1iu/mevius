version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/store/queries/"
    schema: "internal/store/migrations/"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "database/sql"
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "provider_connection.provider"
            go_type: "string"
          - column: "slot.role"
            go_type: "string"
          - column: "binding.sync_status"
            go_type: "string"